l_simp_chinese:

 # =============================================================
 # OTTOMAN EMPIRE (奥斯曼帝国)
 # =============================================================
 aga_tr_tur_iskele: "奥斯曼登岸码头"
 aga_tr_tur_iskele_desc: "伊斯凯莱（Iskele）是奥斯曼帝国指定的港口区，在帝国的监督下，货物在这里卸载、征税和重新分配。赋予这一特权，正式确立了该城镇作为苏丹海上商业网络节点的地位。"

 aga_tr_ottoman_vakif_endowment: "瓦克夫宗教基金"
 aga_tr_ottoman_vakif_endowment_desc: "瓦克夫（Vakıf）是奥斯曼帝国的虔诚基金会，依靠专项收入为清真寺、学校和公共浴室提供资金。获得这项特权的城镇将成为伊斯兰公民生活的中心，并由永久性的宗教捐赠所维持。"

 #aga_tr_ottoman_timar_garrison: "提马尔驻军"
 #aga_tr_ottoman_timar_garrison_desc: "提马尔（Timar）制度将一个城镇的税收分配给西帕希骑兵，以换取其服兵役。这项特权将城镇置于当地提马尔持有者的军事化管辖之下，以牺牲王室直接收入为代价加强了当地的防御。"
 aga_tr_tur_janissary_garrison: "耶尼切里驻军"
 aga_tr_tur_janissary_garrison_desc: "耶尼切里（Janissaries）是奥斯曼苏丹的精锐奴隶步兵，驻扎在帝国各地的堡垒军营中，他们只听命于最高朴特（帝国政府），而不受任何地方领主或贵族的管辖。他们在一个城镇的驻扎是帝国信任的标志，同时也是在警告贵族：苏丹的权力已直接触及此地。"

 # =============================================================
 # RUSSIA / MUSCOVY (俄罗斯 / 莫斯科)
 # =============================================================
 aga_tr_rus_pomor: "波莫尔渔业定居点"
 aga_tr_rus_pomor_desc: "波莫尔人是坚韧的俄罗斯航海者，他们定居在白海和北极沿岸，通过捕鱼和与内陆的贸易来维持生计。这项特权承认了该城镇作为边疆渔业社区的身份，其运作超出了常规农业税收的管辖范围。"

 aga_tr_russian_sloboda: "斯洛博达自由村"
 aga_tr_russian_sloboda_desc: "斯洛博达（Sloboda）是免税的定居点，旨在吸引工匠、商人和自由农前往人口稀少的地区。这项特权将城镇转变为一个富有生产力的自由区，以减少义务的承诺吸引熟练的工人。"

 aga_tr_russian_posad: "波萨德商贾区"
 aga_tr_russian_posad_desc: "波萨德（Posad）是俄罗斯城镇的商业郊区，是在王室登记的纳税商人和工匠的聚居地。确立这项特权，巩固了该城镇的市场功能及其对莫斯科贸易体系的义务。"

 aga_tr_russian_oprichnina_district: "特辖区"
 aga_tr_russian_oprichnina_district_desc: "特辖区（Oprichnina）是伊凡雷帝用来摧毁波雅尔贵族权力的工具，他划分出由王室直接控制的领地，并由其私人代理人进行管理。置于该特权下的城镇将直接归属于沙皇的黑袍执法者管辖，在削弱地方贵族的同时也会付出引发动荡的代价。"

 # =============================================================
 # VENICE / ITALIAN (威尼斯 / 意大利)
 # =============================================================
 aga_tr_venetian_contrada: "市民坊区特许状"
 aga_tr_venetian_contrada_desc: "坊区（Contrada）制度将意大利城市划分为不同的市民街区，每个街区都有自己的商人行会、公共机构和社区认同，在国家层面之下组织城市生活。确立这一特权为该市的市民阶层提供了一个结构化的自治框架。"

 aga_tr_venetian_arsenal_quarter: "兵工厂区"
 aga_tr_venetian_arsenal_quarter_desc: "伟大的意大利海上城邦发展出了专门的造船区，木匠、填缝工、制绳工和制帆工在国家监督下集中有序地工作。这里生产战船和商船的效率，在中世纪世界无人能及。"

 aga_tr_venetian_rialto_exchange: "商人交易所"
 aga_tr_venetian_rialto_exchange_desc: "意大利商人交易所是中世纪世界最成熟的商业文明的制度核心，在这里，通过那些银行网络从伦敦延伸至亚历山大的商人们，汇票、保险合同和商品价格得以顺利谈判与敲定。"

 # =============================================================
 # JAPAN (日本)
 # =============================================================
 aga_tr_japanese_za_guild: "座商行会特许状"
 aga_tr_japanese_za_guild_desc: "“座”（Za）是日本的商人和工匠行会，在贵族或寺庙的庇护下运作，通过缴纳费用并效忠来控制特定商品的生产和销售。这项特权确立了城镇工匠社区的行会结构，在特许垄断下组织生产。"

 aga_tr_japanese_castle_town: "城下町"
 aga_tr_japanese_castle_town_desc: "城下町（Jōkamachi）是在领主城堡的阴影下发展起来的城镇，其街道的规划是为了供应、保护和服务上方的要塞。这项特权将城镇的身份和经济与封建领主的军事需求绑定在一起。"

 # =============================================================
 # ARABS (阿拉伯)
 # =============================================================
 aga_tr_arab_funduq: "商队客栈特许状"
 aga_tr_arab_funduq_desc: "商队客栈（Funduq）是集客栈、仓库和交易厅于一体的设施，外国商人可以在受监管的条件下进行商业活动。授予这项特权确立了该城镇作为公认的区域间商业枢纽的地位，吸引了来自伊斯兰世界各地的长途贸易商。"

 aga_tr_arab_waqf_hospital: "瓦克夫医院"
 aga_tr_arab_waqf_hospital_desc: "这种由伊斯兰瓦克夫（Waqf）宗教基金资助的医院，为病人提供医疗服务，而不论其信仰或财力。这项特权在城镇建立了一个永久性的慈善医疗机构，并由专门的宗教收入维持运转。"

 aga_tr_egy_mamluk_garrison: "马穆鲁克驻军"
 aga_tr_egy_mamluk_garrison_desc: "马穆鲁克体系培养了受过卓越训练的奴隶士兵，他们由特定城镇提供住处和资金，作为苏丹军事家族的直接延伸。这项特权在城镇中设立了马穆鲁克兵营，提供效忠于王室而非地方显贵的精锐部队。"

 aga_tr_egy_nile_cultivation: "尼罗河泛滥权"
 aga_tr_egy_nile_cultivation_desc: "埃及的农业完全依赖于尼罗河的年度泛滥，洪水在三角洲和河谷沉积了肥沃的淤泥。这项特权确立了城镇对退水期农业的管理，这是世界上生产力最高的农业系统之一。"

 aga_tr_arab_mellah: "梅拉赫犹太区"
 aga_tr_arab_mellah_desc: "梅拉赫（Mellah）是北非和安达卢西亚城市中指定的犹太区，犹太社区在统治当局的保护下生活，以换取税收和商业服务。这项特权建立了一个正式的梅拉赫，吸引了受过教育的商人社区，他们的技能丰富了城镇的经济。"

 aga_tr_maghrebi_corsairs: "海盗港口"
 aga_tr_maghrebi_corsairs_desc: "巴巴里海盗以马格里布沿岸的指定港口为基地，拿着当地统治者颁发的私掠许可证掠夺基督教船只。这项特权确立了该城镇作为私掠基地的角色，吸引水手和投资者加入利润丰厚的奴隶掠夺经济。"

 aga_tr_maghrebi_tribes: "部落整合特许状"
 aga_tr_maghrebi_tribes_desc: "马格里布的城镇在与周围部落联盟的不断谈判中生存，通过提供市场准入和法律认可，将游牧人口吸收进定居生活。这项特权建立了一套正式的机制，以将部落移民整合进城镇人口中。"

 # =============================================================
 # TEUTONIC ORDER (条顿骑士团)
 # =============================================================
 aga_tr_teutonic_komturei: "骑士团指挥官辖区"
 aga_tr_teutonic_komturei_desc: "指挥官辖区（Komturei）是条顿骑士团的军事堡垒行政单位，结合了军事驻军与教会政府，其指挥官直接对大团长负责。这项特权将城镇置于骑士团直接的军事和精神管辖之下。"

 aga_tr_teutonic_hanseatic_privilege: "汉萨特权"
 aga_tr_teutonic_hanseatic_privilege_desc: "条顿骑士团的波罗的海港口构成了汉萨同盟贸易网络的关键部分，用波罗的海的谷物、琥珀和木材交换佛兰德斯的布匹和英国的羊毛。这项特权赋予了该城镇汉萨商业保护，吸引北方商贾进入其市场。"

 # =============================================================
 # MALI EMPIRE (马里帝国)
 # =============================================================
 aga_tr_mali_dyula_market: "迪乌拉市场"
 aga_tr_mali_dyula_market_desc: "迪乌拉人（Dyula）是分布广泛的西非穆斯林贸易族群，他们在萨赫勒地区和森林地带建立了一个商业网络。这项特权正式确立了该城镇作为迪乌拉商业网络节点的地位，吸引了经营黄金、可乐果和布匹的长途贸易商。"

 aga_tr_mali_griot_quarter: "格里奥史官区"
 aga_tr_mali_griot_quarter_desc: "格里奥（Griots）是西非社会口述传统的世袭保存者，担任着统治家族的史学家、音乐家和顾问。拥有获得认可的格里奥区的城镇，将成为曼德世界文化记忆和政治正统性的中心。"

 aga_tr_mali_gold_town: "黄金城特许状"
 aga_tr_mali_gold_town_desc: "西部苏丹的产金城镇是地球上最富有的地方之一，吸引了撒哈拉商人和北非商贾来到他们的市场。这项特权指定该城镇为正式的黄金交易中心，将马里金矿的巨额财富汇集于其市场中。"

 # =============================================================
 # CHINA (中国)
 # =============================================================
 aga_tr_china_lijia_system: "里甲制行政"
 aga_tr_china_lijia_system_desc: "里甲制将中国社会组织成以户为单位的层级系统，代表帝国官僚机构负责税收征收、劳役派遣和维持地方治安。这项特权正式确立了城镇在儒家公民原则下的自治，改善了控制力和农民的福利。"

 aga_tr_china_examination_school: "科举官学"
 aga_tr_china_examination_school_desc: "科举制度是中国治理体系的骨干，通过对古典文学和治国理政的严格考试来选拔官员。被授予官学地位的城镇将成为学术中心，其毕业生将不断为帝国的官僚机器输送血液。"

 aga_tr_china_silk_guild: "皇家织造局"
 aga_tr_china_silk_guild_desc: "中国的丝绸生产是世界上最复杂的纺织工业，在皇家的监督下，行会控制了从养蚕到织造的每一个环节。这项特权在行会特许状下确立了城镇的丝绸工业，保证了质量，并将产品引向皇家市场。"

 # =============================================================
 # KYIV / RUTHENIA (基辅 / 鲁塞尼亚)
 # =============================================================
 aga_tr_ruthenian_magdeburg: "马格德堡法特许状"
 aga_tr_ruthenian_magdeburg_desc: "马格德堡法赋予了城镇一种源于德国的自治形式，这种形式在波兰-立陶宛和鲁塞尼亚广泛采用，赋予市民对其法庭和市场的控制权。这项特权在这一享有盛誉的法律框架下，将城镇确立为自治市镇。"

 aga_tr_ruthenian_cossack_suburb: "哥萨克城郊"
 aga_tr_ruthenian_cossack_suburb_desc: "在鲁塞尼亚城镇边缘形成的哥萨克定居点创造了一种自由民的尚武亚文化，他们效忠于自己的盖特曼，而不是贵族。这项特权承认哥萨克社区在城镇边缘的存在，赋予他们自治权以换取兵役。"

 aga_tr_ruthenian_chernozem: "黑土开垦"
 aga_tr_ruthenian_chernozem_desc: "乌克兰大草原的黑土是世界上最肥沃的土壤之一，其农业产量足以让西欧相形见绌。这项特权确立了城镇对其周围黑土农田的管理，将草原边疆的非凡生产力最大化。"

 # =============================================================
 # SOMALIA (索马里)
 # =============================================================
 aga_tr_somali_banaadir_port: "巴纳迪尔港口特许状"
 aga_tr_somali_banaadir_port_desc: "索马里的巴纳迪尔海岸是一串古老的印度洋贸易城市，将东非与阿拉伯、波斯和印度连接起来。这项特权确立了该城镇在巴纳迪尔网络中的正式商埠地位，吸引了横跨西印度洋的季风商人。"

 # =============================================================
 # DAI VIET (大越)
 # =============================================================
 aga_tr_viet_lang_bang_market: "郎邦乡村市集"
 aga_tr_viet_lang_bang_market_desc: "大越的定期集市组织了高地林业产品与低地大米和制成品的交换，跨越了该国多样化的地形。这项特权确立了城镇作为郎邦集市枢纽的角色，整合了高地与低地经济。"

 aga_tr_rice_farm: "水稻种植"
 aga_tr_rice_farm_desc: "越南的水稻农业在红河和湄公河三角洲经过数千年的完善，维持着亚洲最密集的农村人口。这项特权确立了城镇对灌溉稻田的管理，这是越南繁荣和军事人力的基础。"

 # =============================================================
 # KOREA (朝鲜)
 # =============================================================
 aga_tr_korean_celadon: "青瓷官窑特许状"
 aga_tr_korean_celadon_desc: "带有独特翡翠绿釉的朝鲜青瓷是东亚最珍贵的奢侈品之一，备受中国皇帝和日本贵族的觊觎。这项特权在皇家特许下建立了城镇的瓷窑，确立了高丽最著名的艺术出口品的生产。"

 aga_tr_korean_weaponry: "皇家兵工厂特许状"
 aga_tr_korean_weaponry_desc: "朝鲜王朝维持着一个复杂的国家军械工业，生产弓、剑以及后来的火器，以供应其军队对抗日本和女真的威胁。这项特权将城镇指定为皇家兵工厂，要求其工匠满足王室的军事需求，以换取保护地位。"

 # =============================================================
 # KHMER (高棉)
 # =============================================================
 aga_tr_khmer_prasat_quarter: "普拉萨特神庙区"
 aga_tr_khmer_prasat_quarter_desc: "普拉萨特（石砌神庙塔）是高棉城市生活的中心，同时作为宗教圣地、行政枢纽和皇家宇宙权威的象征。这项特权在城镇建立了一个正式的神庙区，将其公民生活与高棉仪式王权的节奏绑定在一起。"

 aga_tr_khmer_baray_district: "巴莱灌溉区"
 aga_tr_khmer_baray_district_desc: "吴哥巨大的巴莱（人工水库）维持了高棉帝国的水利农业，使其在季风气候下也能实现一年多次的水稻收获。这项特权确立了城镇对其巴莱灌溉基础设施的管理，这是高棉农业丰产的基础。"

 # =============================================================
 # VIJAYANAGARA (维查耶纳加尔)
 # =============================================================
 aga_tr_vijayanagara_nayaka_fort: "纳亚卡堡垒"
 aga_tr_vijayanagara_nayaka_fort_desc: "纳亚卡是由维查耶纳加尔任命的军事总督，负责管理被征服的领土，每人负责维持一座堡垒和保卫它的军队。这项特权将城镇置于纳亚卡的军事化管辖之下，优先考虑保卫德干边疆而不是平民商业。"

 aga_tr_vijayanagara_diamond_market: "钻石市场特许状"
 aga_tr_vijayanagara_diamond_market_desc: "在巴西金刚石矿发现之前，德干高原的戈尔孔达和科鲁尔钻石矿是世界上唯一的钻石重要来源，使维查耶纳加尔成为了全球宝石贸易的中心。这项特权确立了城镇在钻石供应链中的地位，吸引了来自波斯、阿拉伯和欧洲的商人。"

 aga_tr_vijaya_devasthana: "提婆斯塔纳神庙特许状"
 aga_tr_vijaya_devasthana_desc: "维查耶纳加尔的大神庙远不止是礼拜场所——它们是南印度城镇的经济引擎，同时作为地主、放贷者、雇主和市场组织者，服务于周围发展起来的社区。这份特许状正式承认神庙对城镇的民事管辖权。"

 # =============================================================
 # BULGARIA (保加利亚)
 # =============================================================
 aga_tr_bul_tarnovo_privilege: "特尔诺沃特权"
 aga_tr_bul_tarnovo_privilege_desc: "保加利亚第二帝国的首都特尔诺沃颁布了特许状，规范了保加利亚各地的东正教教会、贵族和商人社区的权利。这项特权将特尔诺沃负有盛名的法律传统延伸至该城镇，提升了其神职人员和市民机构的地位。"

 aga_tr_bul_rose_valley: "玫瑰谷种植"
 aga_tr_bul_rose_valley_desc: "巴尔干山麓的河谷盛产高品质的玫瑰和药草，作为奢侈品在黑海世界进行贸易。这项特权确立了城镇对这些芳香作物的种植，维持着有别于谷物种植的繁荣农业经济。"

 aga_tr_bul_bogomil_suppression: "镇压保格米尔派"
 aga_tr_bul_bogomil_suppression_desc: "拒绝物质世界和东正教会权威的保格米尔异端，尽管屡遭谴责，但仍顽固地在保加利亚农村社会中传播。这项特权赋予了城镇的教会当局根除异端社区的权力，在加强东正教一致性的同时付出了引发地方动乱的代价。"

 # =============================================================
 # SERBIA (塞尔维亚)
 # =============================================================
 aga_tr_ser_sasski_mining: "萨斯基采矿权"
 aga_tr_ser_sasski_mining_desc: "受塞尔维亚统治者邀请来诺沃布尔多和斯雷布雷尼察开采金银矿的萨克森（Sašski）殖民者，带来了中欧的采矿技术，将塞尔维亚变成了中世纪欧洲最富有的矿产区之一。这项特权确立了他们的特权地位，以技术知识换取扩大的开采权。"

 aga_tr_ser_nemanjic_grant: "涅曼尼亚土地封地"
 aga_tr_ser_nemanjic_grant_desc: "涅曼尼亚王朝通过对东正教修道院的慷慨资助来确立其正统性，授予它们土地、农奴和法律豁免权，使塞尔维亚的修道院城镇成为巴尔干地区最强大的机构之一。这项特权将这一传统延伸至一个以修道院为核心的城镇，提升了其神职人员和文化地位。"

 aga_tr_ser_vlach_right: "弗拉赫游牧权"
 aga_tr_ser_vlach_right_desc: "塞尔维亚高地的半游牧弗拉赫社区通过进贡牲畜和提供轻骑兵征召，换取了在贵族土地上自由移动羊群的权利。这项特权确立了他们与城镇的关系，将山区的游牧经济整合进了塞尔维亚的军事体系之中。"

 # =============================================================
 # POLAND-LITHUANIA (波兰-立陶宛)
 # =============================================================
 aga_tr_pol_folwark: "福尔瓦克直属庄园"
 aga_tr_pol_folwark_desc: "福尔瓦克（Folwark）是波兰贵族的大型庄园制谷物地产，由被剥夺法律自由的农奴耕作，以满足波罗的海谷物贸易永无止境的需求。"
 
 aga_tr_pol_ruthenian_orthodoxy: "宽容鲁塞尼亚东正教"
 aga_tr_pol_ruthenian_orthodoxy_desc: "在东正教信徒占人口很大比例的城镇，正式承认东正教会的权威。以宗教自治来换取这些本可能向东寻求莫斯科保护的社区的忠诚。"
 
 aga_tr_pol_magnate: "权贵领地"
 aga_tr_pol_magnate_desc: "波兰-立陶宛的大权贵家族掌握着令欧洲次级贵族相形见绌的权力，他们维持着私人军队，发布自己的司法判决，并在他们控制的领地上将王室削弱为一个名义上的存在。"
 
 # =============================================================
 # GEORGIA (格鲁吉亚)
 # =============================================================
 aga_tr_geo_tamar_patent: "塔玛拉皇家特许权"
 aga_tr_geo_tamar_patent_desc: "塔玛拉女王的统治标志着格鲁吉亚的黄金时代，当时第比利斯作为高加索地区连接黑海和丝绸之路的伟大贸易城市之一。这项特权指定城镇为王室认可的市场枢纽，借助格鲁吉亚最著名君主的威望来吸引商人。"

 aga_tr_geo_catholic_charter: "大公辅主教特许状"
 aga_tr_geo_catholic_charter_desc: "格鲁吉亚东正教的大公辅主教（Catholicos）掌握着足以与世俗统治者相匹敌的权威，其颁布的特许状管理着从洞穴修道院到大教堂所在城市的宗教和教育生活。这项特权将城镇置于大公辅主教的庇护之下，将其公民身份与格鲁吉亚教会绑定在一起。"

 # =============================================================
 # WALLACHIA / MOLDAVIA (瓦拉几亚 / 摩尔达维亚)
 # =============================================================
 aga_tr_rom_voivodas: "大公封地"
 aga_tr_rom_voivodas_desc: "大公（Voivode）在罗马尼亚城镇中掌握着军事指挥权和民政权威，通过颁布特许状界定当地贵族的权利和义务，以换取其武装服役。该封地确立了城镇在大公军事等级体系中的地位，加强了贵族的征召。"

 aga_tr_rom_danubian_staple: "多瑙河转售权"
 aga_tr_rom_danubian_staple_desc: "沿多瑙河的瓦拉几亚城镇控制着顺流向黑海和奥斯曼市场出口的谷物与牲畜，从驶过其水域的每一艘驳船上榨取财富。这项转售权迫使路过的商人必须首先在当地出售货物，从而将河流贸易的利润集中在城镇市场中。"

 # =============================================================
 # PERSIA (波斯)
 # =============================================================
 aga_tr_ira_caravanserai: "商队驿站特许状"
 aga_tr_ira_caravanserai_desc: "伊朗高原的商队驿站网络支撑着跨越亚洲最恶劣地形之一的陆路贸易，为往返于地中海与中亚之间的商人们提供水、住所和安全保障。这项特许状指定该城镇为官方的商队驿站，将其整合进波斯的皇家道路系统中。"

 aga_tr_ira_silk_loom: "丝织机特许权"
 aga_tr_ira_silk_loom_desc: "波斯丝绸是世界上最珍贵的奢华纺织品之一，在里海沿岸的作坊中编织，贸易远至威尼斯和北京。这项权利确立了城镇的丝织业，将其织机连接到萨非和帖木儿贸易网络的伟大商业动脉上。"

 aga_tr_ira_shia: "什叶派宗教基金权"
 aga_tr_ira_shia_desc: "萨非王朝将波斯转变为十二伊玛目什叶派信仰，创造了一个庞大的神龛、神学院和捐赠网络，由王室税收资助城市的宗教生活。这项权利在城镇设立了正式的什叶派基金，赋予神职人员权力并加深社区的教派认同。"

 aga_tr_ira_sufi: "苏菲派道堂特许状"
 aga_tr_ira_sufi_desc: "苏菲派道堂（Khanaqah）是波斯城镇的社会与精神核心，提供慈善援助，调解纠纷，并弥合了正统乌理玛与民众宗教实践之间的鸿沟。这项特许状承认道堂在城镇中的权威，赋予苏菲教团在城市治理中的正式角色。"

 aga_tr_ira_ghulam_garrison: "古拉姆驻军权"
 aga_tr_ira_ghulam_garrison_desc: "由格鲁吉亚人、亚美尼亚人和切尔克斯奴隶士兵组成的萨非古拉姆（Ghulam）军团，为沙阿提供了一支独立于动荡的克孜勒巴什部落贵族之外的忠诚军事力量。这项权利在城镇中部署了古拉姆驻军，扩大了王室直接的军事影响力，代价是削弱贵族和市民的自治权。"

 # =============================================================
 # ETHIOPIA (埃塞俄比亚)
 # =============================================================
 aga_tr_ethiopian_negad_market: "内加德拉斯市场特许状"
 aga_tr_ethiopian_negad_market_desc: "内加德拉斯（Negadras）即商贸长，是埃塞俄比亚王室任命监督主要集市城镇贸易的官员，负责收税和解决商业纠纷。这项特许状将城镇市场置于内加德拉斯的监督之下，将其整合进所罗门王朝的商业行政体系之中。"

 aga_tr_ethiopian_debre_monastery: "德布雷修道院特许状"
 aga_tr_ethiopian_debre_monastery_desc: "埃塞俄比亚伟大的以德布雷（Debre）为前缀的修道院城镇，从德布雷-利巴诺斯到德布雷-达莫，是吉兹语学习、手稿制作和东正教精神权威的中心。这项特许状承认修道院在城镇公民生活中的作用，提升其神职人员和文化传统的地位。"

 aga_tr_cawa_muster: "卡瓦集结权"
 aga_tr_cawa_muster_desc: "卡瓦（Cawa）是直接效力于埃塞俄比亚皇帝的精锐皇家骑兵，有别于通过古尔特体系征召的封建贵族军队。这项权利将城镇指定为卡瓦部队的集结点，将王室的直接军事权威延伸到该地区，刻意以此削弱地方贵族的力量。"

 aga_tr_gult_grant: "古尔特土地封地"
 aga_tr_gult_grant_desc: "古尔特（Gult）体系将向农民征收贡品的权利分配给埃塞俄比亚贵族和神职人员，以换取其军事和行政服务，构成了所罗门王朝封建治理的基础。这项封地确立了贵族对城镇农业剩余的控制权，在加强地方征召兵源的同时加深了贵族的自治。"

 # =============================================================
 # UNIQUE PER CITY (各个城市的独特特权)
 # =============================================================
 aga_tr_city_hormuz: "海湾门户"
 aga_tr_city_hormuz_desc: "霍尔木兹扼守着波斯湾与印度洋之间的狭窄海峡，使其成为所有在阿拉伯、波斯与印度市场间往来的贸易不可或缺的咽喉。每艘运载香料、珍珠或马匹的船只都必须经过它的水域，并向其统治者进贡。"

 aga_tr_city_rome: "永恒之城"
 aga_tr_city_rome_desc: "罗马是教皇的所在地，也是拉丁基督教世界的精神首都，吸引着来自欧洲各个角落的朝圣者、学者和艺术家。占据这座城市所带来的声望，是世界上任何其他城市都无法比拟的。"

 aga_tr_city_venice: "亚得里亚海女王"
 aga_tr_city_venice_desc: "威尼斯是世界上最伟大的海上商业共和国，其潟湖上停满了排桨战船，其里阿尔托桥上挤满了从亚历山大到伦敦的商人。控制了海洋的城市，就控制了地中海的贸易。"

 aga_tr_city_novo_brdo: "白银之山"
 aga_tr_city_novo_brdo_desc: "诺沃布尔多坐落在中世纪欧洲最丰富的银矿带之上，其矿山出产的金属为塞尔维亚国家提供了资金，并吸引了来自欧洲大陆各地的萨克森矿工。谁拥有这座山脉，谁就掌握了巴尔干繁荣的钥匙。"

 aga_tr_city_alexandria: "世界之门"
 aga_tr_city_alexandria_desc: "亚历山大矗立在地中海与尼罗河三角洲的交汇处，将印度洋的贸易汇集到埃及市场，并输送给渴望香料和丝绸的欧洲船队。它是旧世界商业运转的枢纽。"

 aga_tr_city_cairo: "千塔之城"
 aga_tr_city_cairo_desc: "开罗是伊斯兰世界最大的城市和逊尼派文明的知识核心，拥有地球上最伟大的神学院艾资哈尔（Al-Azhar），其市场吸引着从廷巴克图到撒马尔罕的商贾。其财富与学识使其成为非洲和近东无可争议的大都会。"

 aga_tr_city_hangzhou: "人间天堂"
 aga_tr_city_hangzhou_desc: "马可·波罗将杭州称为世界上最美丽华贵的城市，这座充满运河、丝绸作坊和园林的城市，养活了比欧洲任何城市都要多的人口。它的织机生产出的丝绸，足以装点十几个王国的宫廷。"

 aga_tr_city_wuxian: "园林与丝绸之城"
 aga_tr_city_wuxian_desc: "靠近苏州的吴县因其高雅的文化、精致的私家园林以及为帝国宫廷提供全国最优质纺织品的丝织作坊而闻名全中国。这是一座财富与审美修养并驾齐驱的城市。"

 aga_tr_city_kyoto: "上天之都"
 aga_tr_city_kyoto_desc: "数个世纪以来，京都一直是日本天皇的驻地，其网格状的街道布局模仿了中国唐朝的都城，其寺庙积累了一个文明的艺术与精神遗产。即使幕府在其他地方掌握着实权，京都依然是日本神圣的中心。"

 aga_tr_city_kutna_hora: "白银之城"
 aga_tr_city_kutna_hora_desc: "在波希米亚王国的鼎盛时期，库特纳霍拉矿山生产的白银超过了中欧任何其他地方，为圣芭芭拉大教堂的建设提供了资金，并使其成为欧洲最富有的城市之一。其皇家造币厂铸造的布拉格格罗申成为了中世纪欧洲贸易的标准货币。"

 aga_tr_city_falun: "铜山"
 aga_tr_city_falun_desc: "法伦矿山是欧洲最大的单一铜矿来源地，生产的金属用于为教堂铺设屋顶、装备军队以及供应整个欧洲大陆的作坊。瑞典作为大国的崛起，与其说是建立在士兵的英勇之上，不如说是建立在达拉纳的铜矿之上。"

 aga_tr_city_ccantumarcani: "波托西富山"
 aga_tr_city_ccantumarcani_desc: "波托西山蕴藏着如此巨大的银矿，以至于它的发现彻底改变了全球经济，用美洲的白银淹没了欧洲市场，并重塑了国家间的力量平衡。它所产生的财富，是以被迫在其深渊中劳作的人们所承受的极其可怕的代价换来的。"

 aga_tr_city_bruges: "佛兰德斯的明珠"
 aga_tr_city_bruges_desc: "布鲁日曾长达两个世纪作为北欧的商业首都，佛兰德斯的羊毛布料、意大利的银行业和汉萨同盟的毛皮汇聚于此，其市场制定着从伦敦到吕贝克的价格。尽管安特卫普现在与之竞争，但这座城市的布料大厅和运河仓库依然回荡着国际贸易的节奏。"

 aga_tr_city_antwerp: "世界商都"
 aga_tr_city_antwerp_desc: "安特卫普已崛起为北欧最伟大的贸易城市，其交易所制定的利率影响着欧洲大陆的每一位君主，其码头上卸载着来自美洲、非洲和亚洲的货物。控制了安特卫普的城市，就控制了整个大西洋世界的金融神经系统。"

 aga_tr_city_amsterdam: "阿姆斯特尔水坝"
 aga_tr_city_amsterdam_desc: "阿姆斯特丹优良的避风港口和无与伦比的造船能力，使其成为北海正在崛起的商业大国，其仓库里堆满了波罗的海的谷物、伊比利亚的盐和殖民地的香料。主宰这片水域的城市，必将主导下一个世纪的贸易。"

 aga_tr_city_genoa: "傲岸之城"
 aga_tr_city_genoa_desc: "热那亚的排桨舰队及其大胆果敢的商人银行家们建立了一个从黑海延伸至大西洋的商业帝国，他们满怀信心地为国王提供融资并在岛屿上殖民。她的水手在未知的非洲海岸航行，她的金融家甚至把钱借给西班牙王室本身。"

 aga_tr_city_malacca: "香料世界的十字路口"
 aga_tr_city_malacca_desc: "马六甲控制着连接印度洋和南海的必经海峡，使其成为亚洲最有价值的咽喉要道。它的苏丹国通过对那些从海外群岛运往其码头的丁香、肉豆蔻和胡椒征税而变得富甲一方。"

 aga_tr_city_adan: "泪水与财富之门"
 aga_tr_city_adan_desc: "亚丁守卫着红海的入口，向每一艘运载印度香料前往开罗和地中海市场的船只征收关税。它的海港一直是马穆鲁克、奥斯曼帝国和葡萄牙人争夺的战利品，因为谁控制了亚丁，谁就掌握了印度洋贸易的钥匙。"

 aga_tr_city_mogadishu: "斯瓦希里海岸女王"
 aga_tr_city_mogadishu_desc: "摩加迪沙几个世纪以来一直是东非海岸首屈一指的城市，早在欧洲船只绕过好望角之前，它的商人就用黄金、象牙和奴隶与阿拉伯和印度进行贸易。它的繁荣建立在将非洲与更广阔的印度洋世界联系起来的季风之上。"

 aga_tr_city_kilwa: "印度洋的明珠"
 aga_tr_city_kilwa_desc: "基尔瓦·基西瓦尼被伊本·白图泰描述为世界上最美丽的城市之一，其珊瑚石宫殿和清真寺建立在来自大津巴布韦的黄金贸易利润之上。控制了基尔瓦的城市，就控制了印度洋斯瓦希里贸易网络的最南端节点。"

 aga_tr_city_kollam: "马拉巴尔胡椒之都"
 aga_tr_city_kollam_desc: "几个世纪以来，奎隆一直吸引着阿拉伯、中国和后来的欧洲商人，他们被马拉巴尔腹地种植的黑胡椒所吸引，这种黑胡椒在欧洲市场的价值几乎等同于白银。它的港口从不平静，总是忙于将香料货物装载到前往十几个遥远港口的船上。"

 aga_tr_city_goa: "康坎的明珠"
 aga_tr_city_goa_desc: "果阿在康坎海岸的天然良港使其成为西部德干地区首屈一指的港口，后来葡萄牙人将其转变为他们的葡属印度国首都。谁拥有果阿，谁就控制了波斯湾和马拉巴尔香料海岸之间的海上航线。"

 aga_tr_city_samarkand: "丝绸之路的十字路口"
 aga_tr_city_samarkand_desc: "撒马尔罕坐落在连接中国、印度、波斯和地中海的陆路贸易主干道的交汇处，它的集市里摆满了丝绸、玉石和世界上生产的每一种奢侈品。帖木儿把它建成了中亚最宏伟的城市，而它的记忆依然吸引着商人和学者。"

 aga_tr_city_tabriz: "阿塞拜疆的明珠"
 aga_tr_city_tabriz_desc: "从伊儿汗国到萨非王朝，大不里士曾作为历代帝国的首都。它地处安纳托利亚、波斯和高加索之间的交通要道，使其成为中东最伟大的贸易城市之一。它的集市以宝石、丝绸和东方贸易的奢侈品而闻名。"

 aga_tr_city_florence: "文艺复兴的摇篮"
 aga_tr_city_florence_desc: "佛罗伦萨赋予了世界文艺复兴，其商人家族资助了画家、雕塑家和建筑师，重塑了人类文明所能达到的高度。这座属于但丁、布鲁内莱斯基和美第奇家族的城市，是欧洲艺术和知识生活跳动的心脏。"

 aga_tr_city_milano: "意大利的军械库"
 aga_tr_city_milano_desc: "米兰的军械工匠生产出了欧洲最精良的板甲，他们的作坊为从波罗的海到地中海的骑士和雇佣兵队长提供钢铁铠甲，这些铠甲能挡住长矛和弩箭。为战争提供武器的城市，掌握着比任何单场战役胜利都更持久的力量。"

 aga_tr_city_nuremberg: "帝国的作坊"
 aga_tr_city_nuremberg_desc: "纽伦堡的工匠以其精密金属加工技艺在整个欧洲享有盛誉，生产从科学仪器、钟表到火器和彩色玻璃的各种产品。作为帝国自由城市，纽伦堡除了皇帝之外不对任何领主负责，其市民的自豪感唯有其卓越的手工艺方可媲美。"

 aga_tr_city_damascus: "利刃之城"
 aga_tr_city_damascus_desc: "大马士革将它的名字赋予了中世纪世界上最著名的钢铁。这里的铁匠锻造出极其锋利美丽的刀剑，其神秘的纹理让基督教世界和伊斯兰世界的每一个军械工匠惊叹不已。这座城市也是一个伟大的丝绸编织和玻璃吹制中心，其工匠与铸剑师一样充满传奇色彩。"

 aga_tr_city_fuliang: "世界瓷都"
 aga_tr_city_fuliang_desc: "被中世纪商人称为“万窑之城”的景德镇，烧制出的瓷器极其完美，以至于中国皇帝将整个作坊专门保留给宫廷使用。其半透明白色陶瓷的秘方是世界上最令人垂涎的工业机密，对欧洲君主而言，它比黄金更具价值。"

 aga_tr_city_bologna: "学术之母"
 aga_tr_city_bologna_desc: "博洛尼亚大学是世界上最古老的大学，其法学院培养了众多法学家和行政官员，他们任职于意大利各个城邦的宫廷和总理衙门。一座教授法律的城市，必将成为一座尊崇法律的城市。"

 aga_tr_city_paris: "王国的心脏"
 aga_tr_city_paris_desc: "巴黎是法国王权无可争议的中心，其西岱岛容纳了卡佩王朝，其左岸庇护了北欧最伟大的大学。巴黎如何，法国便如何。"

 aga_tr_city_prague: "百塔之城"
 aga_tr_city_prague_desc: "布拉格在查理四世时期作为神圣罗马帝国的首都。查理四世为其赋予了一所大学、一座宏伟的大教堂，以及欧洲最伟大城市之一的地位。其尖塔群是波希米亚雄心的有力证明。"

 aga_tr_city_timbuktu: "撒哈拉的信仰十字路口"
 aga_tr_city_timbuktu_desc: "廷巴克图既是撒哈拉巨大的黄金和盐类贸易的南部终点，也是西非最重要的伊斯兰学术中心，其清真寺和神学院收藏着成千上万份手稿。一座既交易黄金又传播知识的城市，其力量超越了任何单一王朝的更迭。"

 aga_tr_city_kyiv: "罗斯众城之母"
 aga_tr_city_kyiv_desc: "基辅是罗斯民族世代相传的首都，其金顶教堂及其在第聂伯河上的位置，标志着它即使在蒙古人破坏之后，依然是东斯拉夫世界的精神和历史核心。谁占据了基辅，谁就声索了对所有罗斯公国的记忆和正统性宣称。"

 aga_tr_city_angkor: "水利王国的心脏"
 aga_tr_city_angkor_desc: "吴哥通过其非凡的水库和运河网络养活了比任何中世纪欧洲城市都要多的人口，使其能够在柬埔寨洪泛区每年实现多次水稻丰收。尽管帝国的版图已经缩小，但这座城市的水利基础设施仍然是高棉农业丰产的基础。"

 aga_tr_city_moscow: "第三罗马"
 aga_tr_city_moscow_desc: "君士坦丁堡陷落后，莫斯科的教会人士宣称它为第三罗马，是真正东正教基督教的最后守护者和罗马帝国传统的合法继承人。莫斯科大公正是以这一神圣历史为基础建立起他们的正统统治。"

 aga_tr_city_novgorod: "伟大的诺夫哥罗德领主"
 aga_tr_city_novgorod_desc: "诺夫哥罗德作为一个贵族共和国实行了几个世纪的自治，其市民大会（Veche）和商人寡头建立了一个从波罗的海延伸到乌拉尔山脉的商业帝国。即使在莫斯科的统治下，这座城市的毛皮和皮革贸易也维持着大公无法承受摧毁代价的繁荣。"

 aga_tr_city_london: "泰晤士河的王冠"
 aga_tr_city_london_desc: "伦敦是英格兰的商业和政治首都，其泰晤士河码头处理着作为英国经济支柱的羊毛和布匹出口，其塔楼容纳了皇家军械库和金库。控制了泰晤士河的城市，就控制了英格兰通往更广阔世界的通道。"

 aga_tr_city_gdansk: "波罗的海的琥珀之城"
 aga_tr_city_gdansk_desc: "格但斯克扼守维斯瓦河河口，对从波兰腹地流向北欧各地汉萨市场的谷物、木材和毛皮征收通行费。其造船厂建造的船只将波兰的农业剩余带到了阿姆斯特丹和伦敦的餐桌上。"

 aga_tr_city_hamburg: "北海门户"
 aga_tr_city_hamburg_desc: "汉堡位于易北河口的位置，使其成为大西洋贸易进入德国腹地的主要入口，其自由港的地位吸引了那些希望避开领主关税和限制的商人。这座城市的独立性是它最有价值的商业资产。"

 aga_tr_city_sevilla: "美洲之门"
 aga_tr_city_sevilla_desc: "塞维利亚的西印度交易院（Casa de Contratación）掌握着与西属美洲所有贸易的合法垄断权，使其成为波托西白银和加勒比蔗糖流入欧洲市场的漏斗。在大航海时代，基督教世界中没有哪座城市致富的速度能超过塞维利亚。"

 aga_tr_city_lisbon: "海上航路之都"
 aga_tr_city_lisbon_desc: "里斯本的航海家们开辟了绕过非洲通往印度及更远地方的海上航线，将这座城市从一个不起眼的大西洋港口转变为世界上第一个全球性海上帝国的首都。果阿、霍尔木兹和马六甲的财富源源不断地回流至塔霍河。"

 aga_tr_city_dubrovnik: "亚得里亚海的明珠"
 aga_tr_city_dubrovnik_desc: "拉古萨（杜布罗夫尼克）通过高超的外交手腕、谨慎的中立，以及其商船队在奥斯曼巴尔干与拉丁西方之间贸易所产生的繁荣来维持其独立。它的使节受到每个宫廷的欢迎，正是因为拉古萨不威胁任何人，并且与所有人做生意。"

 aga_tr_city_bursa: "丝绸与商队之城"
 aga_tr_city_bursa_desc: "布尔萨是奥斯曼帝国的第一个首都，也是从波斯和中亚来的丝绸之路商队的西部终点，其集市以安纳托利亚最好的丝绸布料而闻名。即使君士坦丁堡在政治上掩盖了它的光芒，布尔萨仍然是奥斯曼丝绸贸易的中心。"

 aga_tr_city_edirne: "欧洲之门"
 aga_tr_city_edirne_desc: "埃迪尔内曾作为奥斯曼帝国征服君士坦丁堡之前的首都，并且仍然是帝国向巴尔干和匈牙利发动军事行动的最重要集结地之一。它位于色雷斯平原的位置使其成为安纳托利亚和欧洲之间不可或缺的门户。"

 aga_tr_city_aleppo: "黎凡特的十字路口"
 aga_tr_city_aleppo_desc: "阿勒颇矗立在连接地中海海岸与美索不达米亚和波斯的路线交汇处，它那些巨大的有顶集市交易着从印度洋流向欧洲市场的棉花、布匹和香料。它是叙利亚内陆的商业首都，也是奥斯曼世界伟大的商埠之一。"

 aga_tr_city_jerusalem: "三教圣城"
 aga_tr_city_jerusalem_desc: "耶路撒冷同时被伊斯兰教、基督教和犹太教视为圣地，其圣地吸引了来自三个大陆的朝圣者，而占据它所带有的象征分量是世界上任何其他城市都无法比拟的。谁占有耶路撒冷，谁就声索了对世界上半数人良知的宣称。"

 aga_tr_city_fez: "非洲的雅典"
 aga_tr_city_fez_desc: "非斯的卡鲁因大学是世界上最古老的持续运营的高等学府之一，几个世纪以来，这座城市的神学院培养了西部伊斯兰世界的学者和法学家。它的制革厂、染坊和金属加工匠人使它不仅是一座学术之城，也是一座精湛工艺之城。"

 aga_tr_city_isfahan: "半个世界"
 aga_tr_city_isfahan_desc: "波斯谚语宣称“伊斯法罕半天下”（Isfahan nisf-e jahan），这座城市宏伟的集市、清真寺和皇家广场证明了这一自豪感。在萨非王朝时期，它成为了近代早期世界最伟大的帝国首都之一，展示了波斯艺术成就和商业活力。"

 aga_tr_city_bukhara: "高贵的布哈拉"
 aga_tr_city_bukhara_desc: "布哈拉是伊斯兰文明的伟大中心之一，其图书馆和神学院培养了数学、医学和神学领域的学者，他们的著作从西班牙到印度广为流传。这座城市位于丝绸之路上的位置使其既是一个知识枢纽，也是一个商业中心。"

 aga_tr_city_delhi_city: "印度斯坦的宝座"
 aga_tr_city_delhi_city_desc: "德里一直是统治恒河平原历代帝国的首都，其红砂岩堡垒和贾玛清真寺见证了曾从其城墙内进行统治的王朝们的野心。谁控制了德里，谁就掌握了主宰整个印度斯坦的象征性钥匙。"

 aga_tr_city_dadu: "北方之都"
 aga_tr_city_dadu_desc: "北京在蒙古元朝时被称为大都，后来成为明朝的永久首都。明朝将其重建为一座以紫禁城为中心的规模宏大的规划城市。它的位置扼守着北方草原游牧民族一直以来威胁中国腹地的关口。"

 aga_tr_city_shangyuan: "南方之都"
 aga_tr_city_shangyuan_desc: "南京曾作为明朝的第一座首都，其城墙是世界上最长的，其人口在14世纪也是所有城市中最多的之一。尽管朝廷向北迁至北京，但这座城市依然保持着其作为长江三角洲行政中心的地位。"

 aga_tr_city_gonder: "众王之城"
 aga_tr_city_gonder_desc: "贡德尔在17世纪成为埃塞俄比亚帝国固定的首都，其一系列皇家城堡以及靠近塔纳湖岛屿修道院的位置，使其成为所罗门王朝政治和宗教生活的中心。它的建立标志着埃塞俄比亚从游动宫廷向定居帝国行政管理的过渡。"

 aga_tr_city_tarnovo: "巴尔干的王冠"
 aga_tr_city_tarnovo_desc: "特尔诺沃是保加利亚第二帝国光荣的首都，其坐落在扬特拉河上方的查雷维茨要塞内，容纳着一个在艺术和教会雄心上可与君士坦丁堡相媲美的宫廷。即使在奥斯曼征服之后，这座城市的东正教宗主教区也保留着对保加利亚帝国伟大时代的记忆。"

 aga_tr_city_belgrad: "匈牙利的钥匙"
 aga_tr_city_belgrad_desc: "贝尔格莱德控制着萨瓦河和多瑙河的交汇处，是潘诺尼亚平原和巴尔干半岛之间的天然门户，任何向北或向南行军的军队都必须夺取或绕过它。它的要塞经历的围攻次数比该地区任何其他要塞都多，其城墙也是因此而建。"

 aga_tr_city_naples_city: "海滨王国"
 aga_tr_city_naples_city_desc: "那不勒斯是欧洲最大的城市之一，其海湾是地中海最优良的天然良港之一。尽管伴随着王朝更迭的政治动荡，其王国仍是意大利最富有的。该城市的规模、战略地位和农业腹地，使其成为每个大国梦寐以求的战利品。"

 aga_tr_city_palermo: "地中海的诺曼明珠"
 aga_tr_city_palermo_desc: "巴勒莫的诺曼国王们建立了一个将阿拉伯、拜占庭和拉丁文化融合为全新事物的宫廷，其成熟多元文化的治理遗产在诺曼人消失后依然存留了很久。西西里肥沃的平原使巴勒莫王国富足到足以吸引欧洲的每一个王朝。"

 aga_tr_city_marrakesh: "阿特拉斯的红色之城"
 aga_tr_city_marrakesh_desc: "马拉喀什由穆拉比特王朝建立，作为其从塞内加尔延伸至西班牙的撒哈拉帝国的首都。它的宫殿、露天市场和库图比亚宣礼塔仍然是西地中海伊斯兰建筑的伟大纪念碑。作为通往阿特拉斯山口及更远撒哈拉路线的门户，它控制着西北非的贸易。"

 aga_tr_city_mecca: "世界之脐"
 aga_tr_city_mecca_desc: "麦加是伊斯兰教最神圣的城市，是吸引世界各地穆斯林进行朝觐的终点，也是每个穆斯林在祈祷时面朝的克尔白所在地。谁掌管着麦加，谁就拥有了对信徒的精神权威，这是任何政治力量都无法复制的。"

 aga_tr_city_harar: "圣徒之城"
 aga_tr_city_harar_desc: "哈拉尔是伊斯兰教最神圣的城市之一，其古老的城墙麦地那内坐落着九十九座清真寺和数百名在非洲之角广受尊崇的圣徒的神龛。它的市场也位于埃塞俄比亚高地贸易与通往索马里海岸路线的十字路口，使其在商业上的活力与精神上的重要性不相上下。"

 aga_tr_city_smolensk: "东方的熔炉"
 aga_tr_city_smolensk_desc: "斯摩棱斯克的金属加工传统使其成为东欧首屈一指的大炮铸造中心，其锻炉为当时任何占据这座城市的大国提供火炮——立陶宛人、莫斯科人和波兰人都同样认识到，斯摩棱斯克的铸造厂太有价值了，不容摧毁。"
 
 aga_tr_city_tunis: "海盗的避风港"
 aga_tr_city_tunis_desc: "突尼斯是北非海岸最重要的海盗基地，它的海港庇护着巴巴里舰队，这些舰队让基督教地中海的航运闻风丧胆，并为马格里布的奴隶市场提供来自西班牙、意大利及更远地方的俘虏。"
 
 aga_tr_city_thessaloniki: "爱琴海的十字路口"
 aga_tr_city_thessaloniki_desc: "塞萨洛尼基曾是拜占庭的第二大城市，在奥斯曼征服后依然是东地中海最具世界性（多元化）的城市之一。其人口融合了希腊人、从伊比利亚被驱逐出的犹太人、土耳其人以及来自整个爱琴海世界的商人。它的纺织作坊生产着闻名整个黎凡特的布料，而它位于埃格纳提亚大道起点的位置，使其成为亚得里亚海和君士坦丁堡之间的天然门户。"
 
 aga_tr_city_trebizond: "拜占庭的余晖"
 aga_tr_city_trebizond_desc: "特拉比松帝国在君士坦丁堡陷落后多存活了八年。当希腊世界的其他地方都落入奥斯曼帝国之手时，其科穆宁宫廷在黑海沿岸维持着拜占庭文明的传统。甚至在其被征服之后，这座城市的丝绸贸易及其位于波斯商队路线西端的位置，使其成为整个黑海上最具商业活力的港口之一。"
 
 aga_tr_city_kaffa: "草原门户"
 aga_tr_city_kaffa_desc: "卡法是热那亚共和国最伟大的黑海殖民地，在奥斯曼帝国终结其独立之前的两个世纪里，本都草原的毛皮、皮革、谷物和奴隶正是通过这座城市流入地中海市场的。"
 
 aga_tr_city_vijayanagar: "胜利之城"
 aga_tr_city_vijayanagar_desc: "维查耶纳加尔在其鼎盛时期是世界上最大的城市之一，其花岗岩街道两旁排列着交易印度洋世界各地钻石、马匹和香料的集市，而维鲁帕克沙神庙建筑群高耸的瞿布罗（塔门）俯瞰着这一切。这座城市是南方最后一个伟大印度教帝国的神圣与政治心脏。"
 
 aga_tr_city_vienna: "多瑙河的大型转售地"
 aga_tr_city_vienna_desc: "维也纳的货物集散权（Stapelrecht）是中欧最强大的转售权之一，它迫使每一个在多瑙河上航行的商人在继续行程之前，必须卸下货物并在这座城市中出售。"
 
 aga_tr_city_constantinople_orthodox: "复兴的万城之女王"
 aga_tr_city_constantinople_orthodox_desc: "将君士坦丁堡归还给东正教之手，是回应自1453年以来在基督教东方溃烂的创伤——重建牧首区，重新祝圣圣索菲亚大教堂，并从那些终结了最后一位罗马皇帝的人手中夺回东正教世界的精神首都。"

 aga_tr_city_constantinople_ottoman: "科斯坦丁尼耶——最高朴特的宝座"
 aga_tr_city_constantinople_ottoman_desc: "在托普卡帕宫进行统治的苏丹，掌管着一座其财富和战略主导地位无可匹敌的城市。在奥斯曼的治理下，伊斯坦布尔既是世界上最大的市场，也是地中海最强大海军力量的总部——它的金角湾内，战舰和香料商船并肩停泊。"

 aga_tr_city_constantinople: "世界渴望之城"
 aga_tr_city_constantinople_desc: "一千年来，君士坦丁堡一直是世界上最令人垂涎的城市。任何征服者所继承的，不仅是这处地点的纯粹荣光，更是每一位未曾拥有它的统治者的嫉妒。作为世界渴望之城和已知世界的市场中心，它的金色城墙熬过了十几个帝国的兴衰，并将继续熬过更多。"

 aga_tr_city_tetzcoco: "诗王之城"
 aga_tr_city_tetzcoco_desc: "特斯科科是阿兹特克三国同盟的思想核心，是伟大的哲人王内萨瓦尔科约特尔（Nezahualcoyotl）的故乡，他的法律改革和诗歌塑造了整个墨西哥谷的政治和文化生活。其文士和法学家所维持的治国传统备受尊崇，甚至连外国统治者都试图效仿从其法庭流传出的法律智慧。"
 
 aga_tr_city_mani: "休氏家族的巨木殿堂"
 aga_tr_city_mani_desc: "马尼坐落在尤卡坦半岛西部茂密森林的中心，其木材满足了休氏家族的建筑需求，他们在玛雅潘衰落后于大殿中进行统治。这座城市的木匠和建筑师在整个半岛闻名遐迩，其精湛的工艺得益于周围林地源源不断的木材供应。"
 
 aga_tr_city_tenochtitlan_aztec: "湖泊的心脏"
 aga_tr_city_tenochtitlan_aztec_desc: "特诺奇蒂特兰从特斯科科湖的水中升起。经过数代人的浮岛农业（chinampa）耕作，这座岛屿被改造为美洲生产力最高的农业景观之一。它的堤道、运河和水上花园养活着庞大的人口，并维持着向外辐射至整个墨西哥谷的政治权威。"
 
 aga_tr_city_tenochtitlan_colonial: "崛起的墨西哥城"
 aga_tr_city_tenochtitlan_colonial_desc: "在陷落的岛屿首都废墟之上崛起了一座新城。随着它成为新殖民秩序的行政中心，它的运河被填平，其神庙被教堂和政府大楼所取代。湖盆的财富以及它在连接太平洋到墨西哥湾海岸贸易路线十字路口的位置，使得任何征服者都无法忽视它的存在。"
 
 aga_tr_city_tzintzuntzan: "蜂鸟之地"
 aga_tr_city_tzintzuntzan_desc: "钦聪灿的作坊生产着中美洲最精美的金属制品，其铁匠掌握的青铜铸造技术是该地区任何其他城市都无法复制的。这座城市所反映的工艺传统如此先进，以至于普雷佩查国家能够武装自己，抵御每一个试图征服它的帝国。"
 
 aga_tr_city_chucuito: "神圣湖畔"
 aga_tr_city_chucuito_desc: "丘奎托坐落在的的喀喀湖畔，这片水域被认为是创世本身的起点，其水域支撑着庞大的渔业经济和宗教权威。朝圣者和祭司同样被这座城市所吸引，其精神分量与它所俯瞰的广阔湖泊相得益彰。"
 
 aga_tr_city_hatunqulla: "高原粮仓"
 aga_tr_city_hatunqulla_desc: "哈通科利亚的梯田产出了大量马铃薯，甚至在印加人踏足的的喀喀盆地之前，这座城市就已成为卢帕卡王国的农业骨干。它的贵族家族通过精心管理在无数代人中不断完善的高海拔农业技术，建立了自己的权力。"
 
 aga_tr_city_sana: "奈兰普继承者的作坊"
 aga_tr_city_sana_desc: "萨纳继承了西坎文明非凡的冶金传统，其工匠制作的金器和精美的工艺品吸引了来自北部海岸各个角落的赞叹。这座城市的作坊传承了一种传说中源自其人民信仰的传奇创始神祇的技艺。"
 
 aga_tr_city_chinchay: "木筏商人的港口"
 aga_tr_city_chinchay_desc: "钦查的商人通过驾驶轻木筏沿太平洋海岸远航寻找海菊蛤（一种在安第斯世界比黄金还要珍贵的物质）积累了财富，并带着货物返回，使这个王国成为沿海伟大的贸易大国之一。它的商业传统如此宝贵，以至于连征服者都认为保留这座城市的贸易网络比拆除它更明智。"
 
 aga_tr_city_al_mukha: "咖啡贸易之港"
 aga_tr_city_al_mukha_desc: "红海上的摩卡港（Al-Mukha）成为世界上首要的咖啡门户。这种豆子在也门高地种植，然后从这些码头运往从开罗到伊斯坦布尔甚至最终到欧洲的各个市场。每一艘停靠其码头的商船都会运走一船货物，这也已成为当今时代最抢手的商品之一。"
 
 aga_tr_city_shiraz: "美酒与诗歌之城"
 aga_tr_city_shiraz_desc: "自古以来，设拉子的葡萄园出产着著名的美酒，它们的声誉与哈菲兹和萨迪的诗句交织在一起。正是这些诗人的诗篇使这座城市因其文化修养而与果园和花园齐名。控制设拉子，就是占据一个几个世纪以来波斯艺术认同与农业丰产共同成长的地方。"

 #+++++++++++++++++++++++++++++++++++++
 # Missing variables added from English localization
 aga_tr_arm_merchant_diaspora: "Armenian Merchant Diaspora"
 aga_tr_arm_merchant_diaspora_desc: "The Armenian merchant diaspora was a network of trading communities that spanned the Near East, linking the markets of Persia, Anatolia, and the Levant. This right formalizes the town's role as a center of Armenian commerce, attracting merchants whose capital and connections enrich the local economy."
 aga_tr_cac_mountain_towers: "Highland Watchtowers"
 aga_tr_cac_mountain_towers_desc: "The stone towers that rise from the crags of the Caucasus were built by highland clans to watch every approach through terrain too broken for any distant ruler to govern directly. Where these towers stand sentinel, a lord's authority reaches further into the mountains than it otherwise ever could."
 aga_tr_hun_black_army: "Fekete Sereg Garrison"
 aga_tr_hun_black_army_desc: "Matthias Corvinus built one of the first permanent professional armies in Europe, its mercenary companies paid year-round through direct taxation rather than assembled and disbanded with each campaign season. A town garrisoning the Black Army stands ready for war at a moment's notice, its soldiers loyal to the crown's coin rather than to any noble banner."
 aga_tr_hun_corvinian_court: "Corvinian Renaissance"
 aga_tr_hun_corvinian_court_desc: "Matthias Corvinus filled his court at Buda with Italian scholars, artists, and the manuscripts of his legendary Bibliotheca Corviniana, transforming Hungary into a genuine outpost of the Renaissance north of the Alps. A city touched by this patronage becomes a place where humanist learning and courtly splendor rival anything found in Florence or Rome."
 aga_tr_hun_gold_mining: "Hungarian Gold Florin"
 aga_tr_hun_gold_mining_desc: "Hungary's mines have made the kingdom the greatest source of gold in Christendom, its florins trusted and traded from Italy to the Baltic on the strength of their consistent purity. The gold that flows from Kremnica and Transylvania has made the Hungarian crown's coinage a benchmark against which lesser currencies are measured."
 aga_tr_swi_markets: "Swiss Waystation"
 aga_tr_swi_markets_desc: "The Swiss cantons sit astride the great Alpine passes linking Italy to Germany and France, their towns growing wealthy as way-stations for merchants who have no choice but to pass through on their way over the mountains. Every fair and market town along these routes profits simply from standing where it stands."
 aga_tr_swi_mountain_self_ctrl: "Landsgemeinde Self-Rule"
 aga_tr_swi_mountain_self_ctrl_desc: "In the high valleys of the Confederacy, free peasants and herdsmen gather in open assembly to govern themselves directly, a tradition born of isolation and necessity in terrain too rugged for any distant lord to truly control. The mountain communes answer to their own councils long before they answer to any duke or bishop."
 aga_tr_celt_livestock: "Grazing Commons"
 aga_tr_celt_livestock_desc: "Special privileges protect the drovers who drive great herds to market across the Highlands and Ireland. Their trade fills the town with livestock, merchants, and seasonal wealth."
 aga_tr_order_proselytizer: "Missionary Crusade"
 aga_tr_order_proselytizer_desc: "The military orders combined the sword with the cross, using conquered towns as instruments of religious transformation as much as fortified outposts. Local populations subjected to this zealous campaign of conversion often chafe under the pressure, even as the faith of the order takes deeper root."
 aga_tr_order_military: "Order Stronghold Garrison"
 aga_tr_order_military_desc: "The military orders built their power on permanent garrisons of warrior-monks, disciplined and celibate brothers who held their fortresses as sacred trusts rather than feudal fiefs. A town anchoring one of these strongholds becomes a bastion whose defense is bound as much to holy vow as to military necessity."
 aga_tr_hos_medici: "Hospital of the Order"
 aga_tr_hos_medici_desc: "The Knights Hospitaller trace their very origin to the care of the sick and the poor, and even as the order grew into a formidable naval and military power, its hospitals and infirmaries never ceased operating in the towns under its protection. Physicians trained in the order's tradition are counted among the finest in Christendom."
 aga_tr_hos_naval_base: "Order Shipyard"
 aga_tr_hos_naval_base_desc: "The Knights Hospitaller built their reputation as much on the sea as on the battlefield, their galleys patrolling the Mediterranean to harry Muslim shipping and protect Christian pilgrims bound for the Holy Land. A port dedicated to the order's fleet becomes a shipyard of holy war, its slipways never idle for long."
 aga_tr_fra_clos_monastique: "Monastic Clos"
 aga_tr_fra_clos_monastique_desc: "The monks of Burgundy have spent generations studying every subtle variation of soil and slope, walling off their finest vineyard plots into clos tended with an almost scriptural devotion. Their patient cultivation has made French wine synonymous with refinement long before any noble table in Europe learned to ask for it by name."
 aga_tr_ita_appassimento: "Appassimento Method"
 aga_tr_ita_appassimento_desc: "Italian vintners lay their finest grapes out to dry on straw mats through the autumn air, patiently concentrating their sugars and flavor before the fruit ever touches the press. The wine that results from this slow transformation carries a richness and strength that no ordinary harvest can match."
 aga_tr_ger_beer: "Brauhaus Tradition"
 aga_tr_ger_beer_desc: "German towns have refined the craft of brewing into a matter of civic pride, their brauhauses producing beer of a consistency and quality that draws drinkers from every corner of the Empire. Where German artisans set the standard, every neighboring land measures its own beer against it."
 aga_tr_boh_beer: "Pilsner Heritage"
 aga_tr_boh_beer_desc: "Bohemia's brewers have elevated beer-making beyond mere craft into something approaching alchemy, their mastery of malt, hops, and water yielding a beer so celebrated that towns across Central Europe seek to imitate the Bohemian method rather than compete with it. Few crowns anywhere prize their brewing tradition as fiercely as the Bohemian kings."
 aga_tr_geo_wine: "Qvevri Vintners"
 aga_tr_geo_wine_desc: "Georgian winemakers ferment their harvest in massive clay qvevri buried beneath the earth, a method practiced unbroken since before the memory of any living dynasty. The wine that emerges carries the taste of a tradition older than Christianity itself in a land where wine and faith have grown together since antiquity."
 aga_tr_maj_pasisir_port: "Pasisir Port"
 aga_tr_maj_pasisir_port_desc: "The Pasisir coast of Java was a string of trading towns that connected the spice-producing islands of the archipelago to the markets of India, China, and Arabia. This right establishes the town as a formal entrepôt in the Pasisir network, drawing monsoon traders from across the Indian Ocean."
 aga_tr_slave_town: "Slave Labor Town"
 aga_tr_slave_town_desc: "This town has been reorganized entirely around forced labor, its fields and workshops worked by the enslaved under the constant watch of overseers who answer only to their profit ledgers. Output climbs under this brutal discipline, but so does the ever-present risk of revolt among those who have nothing left to lose."
 aga_tr_indo_war_elephants: "War Elephant Stables"
 aga_tr_indo_war_elephants_desc: "The war elephant has been the decisive weapon of Indian warfare since antiquity, its sheer mass and psychological impact capable of shattering enemy formations and trampling fortifications that no cavalry charge could breach. Towns granted stables for capturing and training these animals supply the crown with a weapon that has terrified armies from the Indus to the Deccan for two thousand years."
 aga_tr_indo_iqta_assignment: "Iqta Assignment"
 aga_tr_indo_iqta_assignment_desc: "The iqta system grants a town's revenue to a military commander in exchange for maintaining troops in the sultan's service, a practical solution to paying an army without a developed treasury but one that steadily erodes the crown's direct authority over its own territory."
 aga_tr_indo_conversion: "Active Conversion Policy"
 aga_tr_indo_conversion_desc: "Some rulers see the temples, madrasas, and Sufi lodges of their towns not merely as places of worship but as instruments of religious transformation, pressing the machinery of conversion to bring the population into the fold of the true faith. The clergy oversee this work, but forced conversion leaves resentment that lingers."
 aga_tr_indo_dhimmi_protection: "Dhimmi Protection Charter"
 aga_tr_indo_dhimmi_protection_desc: "Rather than press for conversion, this charter formally recognizes the right of non-Muslim subjects to practice their faith undisturbed in exchange for their loyalty and taxes, a pragmatic accommodation that has allowed Hindu, Jain, and other communities to flourish under Muslim rule for generations."
 aga_tr_indo_stepwells: "Bawari Stepwells"
 aga_tr_indo_stepwells_desc: "The great stepwells of the Indo-Gangetic plain descend in terraced steps far below the parched earth to reach water that sustains a town through the harshest dry season, their carved galleries doubling as cool gathering places and informal sanctuaries from the heat. These monuments of practical engineering have kept settlements alive in country where the monsoon is the only reliable promise of rain."
 aga_tr_indo_mandi_markets: "Mandi Grain Market"
 aga_tr_indo_mandi_markets_desc: "The mandi is the great agricultural wholesale market of the Indo-Gangetic plain, where cultivators bring their grain directly to be weighed, priced, and sold without the mediation of urban merchant guilds that dominate commerce elsewhere. This direct relationship between farmer and market gives the peasantry of a mandi town a bargaining power over crop prices."
 aga_tr_indo_agrahara: "Agrahara Land Grant"
 aga_tr_indo_agrahara_desc: "The agrahara grants a town's land and revenue to learned Brahmins and temple institutions in exchange for ritual, educational, and administrative service to the community. Generations of Sanskrit scholarship, astronomy, and legal learning accumulate wherever an agrahara has taken root, making such towns centers of intellectual prestige as much as religious devotion."
 aga_tr_bengal_muslin: "Dhaka Muslin Workshops"
 aga_tr_bengal_muslin_desc: "Bengali muslin is woven so fine that an entire garment can be drawn through a ring, a craft so renowned that merchants carried it from Dhaka to the courts of Rome in antiquity and to the fashion houses of Europe in this very age. No other cloth in the world commands the price or the reputation of the gossamer cotton produced in these delta workshops."
 aga_tr_bengal_rice_delta: "Ganges-Brahmaputra Rice Delta"
 aga_tr_bengal_rice_delta_desc: "The delta where the Ganges and Brahmaputra rivers meet the sea is among the most fertile farmland on earth, its annual floods depositing silt that sustains rice harvests of an abundance unmatched anywhere else in the subcontinent. This extraordinary agricultural wealth has made Bengal the most densely populated and most fought-over region of India."
 aga_tr_indoaryan_jamdani: "Jamdani Weaving Tradition"
 aga_tr_indoaryan_jamdani_desc: "The weavers of the Gangetic plain produce cotton cloth of extraordinary delicacy, their patterned jamdani technique passed down through generations of craft families whose skill has made the region's textiles prized far beyond India's borders. The looms of these towns hum with a tradition of fine weaving that rivals even the famed muslin of Bengal."
 aga_tr_indo_rajput_garhi: "Rajput Garhi Stronghold"
 aga_tr_indo_rajput_garhi_desc: "The garhi is the fortified clan-hold of the Rajput warrior lineages, a stronghold where loyalty flows not from religious obligation or sultanic appointment but from the bonds of kinship and martial honor that bind a clan to its chieftain."
 aga_tr_city_geneve: "Counting House of the Alps"
 aga_tr_city_geneve_desc: "Geneva's position at the meeting point of trade roads from France, Italy, and the German lands has made it a natural home for merchants, money-changers, and bankers since the great fairs of the late Middle Ages. Its counting houses extend credit and broker deals that reach merchants far beyond the city's modest walls."
 aga_tr_city_zurich: "Guildhall of the Limmat"
 aga_tr_city_zurich_desc: "Zürich's guilds wrested control of the city from its old patrician families and built one of the most fiercely independent burgher governments north of the Alps, their craft and merchant halls dictating the city's laws as much as any council of nobles ever could. Literacy and civic record-keeping flourish under a government that answers first to its own tradesmen."
 aga_tr_city_edinburgh: "Castle on the Crag"
 aga_tr_city_edinburgh_desc: "Edinburgh's fortress crowns a volcanic crag above the Firth of Forth, and from its halls the Stewart kings have governed a realm that has resisted every English attempt at conquest for generations. The city's royal mile links castle to abbey, binding crown and kingdom together in a single strip of stone and memory."
 aga_tr_city_dublin: "Seat of the Pale"
 aga_tr_city_dublin_desc: "Dublin has stood as the administrative heart of English rule in Ireland. The city's harbor and garrison anchor a colonial foothold that every English governor has depended upon to project power into the island beyond."
 aga_tr_city_rodos: "Bastion of the Hospitallers"
 aga_tr_city_rodos_desc: "Rhodes served as the Hospitaller Knights' island fortress for over two centuries, its harbor and walls withstanding repeated Mamluk and Ottoman sieges before finally falling in 1522. The order's engineers transformed the city into one of the most formidable fortifications in the Mediterranean, a symbol of Christian resistance at the edge of the Islamic world."
 aga_tr_city_granada_islamic: "Last Sanctuary"
 aga_tr_city_granada_islamic_desc: "Granada is the last bastion of Islamic Iberia, its Alhambra palace rising above the city as one of the most exquisite achievements of Islamic architecture in the world. The city's acequias carry mountain water down through terraced gardens and silk orchards, sustaining a refined court culture that has drawn Muslim refugees fleeing the advancing Reconquista from every corner of the peninsula."
 aga_tr_city_granada_christian: "Crown of the Reconquista"
 aga_tr_city_granada_christian_desc: "The fall of Granada in 1492 marked the end of nearly eight centuries of Islamic rule in Iberia, and the Catholic Monarchs have poured religious and dynastic significance into the city ever since, transforming the Alhambra into a royal residence and raising the Capilla Real as their eternal resting place. No conquest in the history of Christian Spain carries greater symbolic weight than the taking of this city."
 aga_tr_city_toledo: "Blades of the Tagus"
 aga_tr_city_toledo_desc: "Toledo's swordsmiths have forged blades of legendary quality for centuries, their steel tempered in the waters of the Tagus and prized by knights and monarchs across Christendom and beyond. The city's forges combine inherited Moorish metallurgical skill with Castilian craftsmanship to produce weapons that no rival workshop in Iberia can match."
 aga_tr_city_baghdad: "Bestowed by God"
 aga_tr_city_baghdad_desc: "Baghdad's name still carries the weight of the great caliphate that once ruled from its walls, its House of Wisdom having drawn scholars, poets, and philosophers from every corner of the Islamic world at the height of its glory. Ottoman and Safavid armies have fought over the city again and again, each conqueror understanding that whoever holds Baghdad holds a claim to the legacy of the caliphs themselves."
 aga_tr_city_basra: "Gate to the Gulf"
 aga_tr_city_basra_desc: "Basra sits where the Tigris and Euphrates meet the Persian Gulf, funneling the trade of India and Arabia up the rivers toward Baghdad and beyond. It is also a home to the first Mosque that was built outside the Arabian peninsula."
 aga_tr_city_augsburg: "House of the Fugger"
 aga_tr_city_augsburg_desc: "Augsburg is home to the Fugger banking dynasty, whose loans have financed emperors, funded papal indulgences, and underwritten wars across half of Europe. No city in the Empire wields financial power to rival what flows through Augsburg's counting houses."
 aga_tr_city_vilnius: "Seat of the Gediminids"
 aga_tr_city_vilnius_desc: "Vilnius rose to become the capital of a Grand Duchy that grew, under Gediminas and his heirs, into the largest state in Europe, ruling over vast stretches of the former Rus lands from the banks of the Neris. Here in 1387 the old pagan gods of Lithuania, the last in Europe to hold their ground against Christendom, gave way at last to the cross, binding the fate of the Grand Duchy to Poland and the wider Catholic world."
 aga_tr_city_great_zimbabwe: "Houses of Stone"
 aga_tr_city_great_zimbabwe_desc: "Great Zimbabwe's dry-stone walls rise without mortar or cement, a feat of engineering that anchors a kingdom grown wealthy on cattle and the gold trade flowing down to the Swahili coast. The stone enclosures where its rulers once held court stand as one of the great architectural achievements of the African interior."
 aga_tr_city_targoviste: "Voivode's Justice"
 aga_tr_city_targoviste_desc: "Târgoviște has served as the princely seat of Wallachia for generations, its court hall the place from which voivodes have dispensed a justice as feared as it is effective in holding the boyars to heel. Vlad III ruled from these halls with a reputation for severity that outlived him by centuries."
 aga_tr_city_buda: "Royal Seat on the Danube"
 aga_tr_city_buda_desc: "Buda's royal palace crowns the hill above the Danube, the seat from which Hungarian kings have ruled since the days of the Árpáds and where Matthias Corvinus later built a court to rival any in Renaissance Italy. Whoever holds Buda holds the throne of Hungary in more than name alone."
 aga_tr_city_schwaz: "Silver Valley"
 aga_tr_city_schwaz_desc: "At the town's height during the 15th and 16th centuries, it was an important silver mining center, providing mineral wealth for both the Fugger banking family and, through them, for the Austrian emperors."
 aga_tr_city_villa_di_chiesa: "Silver Mint"
 aga_tr_city_villa_di_chiesa_desc: "Under Pisan domination, Villa di Chiesa was one of the most important and populous cities on Sardinia thanks to its lead and silver resources. At the beginning of the 14th century, its mines produced an estimated 10 percent of Europe's circulating silver."

 aga_tr_city_axum: "Ancient Throne"
 aga_tr_city_axum_desc: "Axum ruled as the seat of a great kingdom in an age when Rome and Persia were the only other powers worth naming, and though its practical dominion has long since passed to other cities, its churches still guard a claim to the Ark of the Covenant that no Ethiopian emperor can ignore."
 
 aga_tr_city_suceava: "Fortress of Stephen the Great"
 aga_tr_city_suceava_desc: "Suceava's dual role as both the princely court and a significant religious center. Moldavia experience growth of dozens of monasteries and churches under the rule of Stephen the Great, many of them commissioned directly from his seat in Suceava, tying the city's identity to authority and religious importance."
 
 # =============================================================
 # FINLAND
 # =============================================================
 aga_tr_fin_tar: "Black Gold Charter"
 aga_tr_fin_tar_desc: "Finnish tar burners work the endless pine forests to produce the sticky black pitch that seals every hull and rigging line in the Baltic and North Sea fleets. No navy in northern Europe can put to sea for long without depending, however indirectly, on the labor of these forest towns."
 
 aga_tr_fin_kaski: "Kaski Clearings"
 aga_tr_fin_kaski_desc: "Finnish settlers burn and clear patches of dense forest to plant rye and barley in the ash-enriched soil, a method that has allowed families to push settlement deep into terrain no ordinary plow could ever break. The clearings shift from year to year, but the harvests they yield have fed generations on land otherwise fit only for timber."
 